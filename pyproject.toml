[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashrun-lab"
version = "0.1.0"
description = "Version-aware Android reverse engineering and automation testing research framework"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
flashrun = "flashrun_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
